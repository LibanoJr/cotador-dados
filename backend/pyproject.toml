# Usado pela Vercel: dependências da função e script de build.
# Mantenha as dependências em sincronia com requirements.txt (usado pelo Docker e localmente).
[project]
name = "cotador-dados"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.3",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.3",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.1",
    "pdfplumber>=0.11",
    "reportlab>=4.0",
    "pydantic>=2.6",
    "anthropic>=0.40",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python build_vercel.py"
