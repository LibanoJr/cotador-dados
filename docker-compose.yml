services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cotador
      POSTGRES_USER: cotador
      POSTGRES_PASSWORD: cotador
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotador -d cotador"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: db
      MEDIA_ROOT: /app/media
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  media:
